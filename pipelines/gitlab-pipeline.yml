stages: [lint, smoke, regression]

variables:
  PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/ms-playwright'

lint:
  stage: lint
  image: mcr.microsoft.com/playwright:v1.55.0-noble
  script: [npm ci, npm run typecheck, npm run lint:check, npx prettier --check .]
  cache:
    paths: [node_modules/]

smoke:
  stage: smoke
  image: mcr.microsoft.com/playwright:v1.55.0-noble
  script: [npx playwright install --with-deps chromium, npm run test:api, npm run test:smoke]
  artifacts:
    when: always
    paths: [playwright-report/, test-results/, logs/]

regression:
  stage: regression
  image: mcr.microsoft.com/playwright:v1.55.0-noble
  parallel:
    matrix: [{ PROJECT: [chromium, firefox, webkit] }]
  script: [npx playwright test tests/ui/regression.spec.ts --project=$PROJECT]
  artifacts:
    when: always
    paths: [playwright-report/, test-results/, logs/]
