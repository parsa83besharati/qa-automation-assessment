parameters:
  - name: project
    type: string
    default: 'chromium'

steps:
  - template: install-deps.yml
    parameters:
      browsers: ${{ parameters.project }}
  - script: |
      npm run typecheck
      npm run lint:check
      npx prettier --check .
    displayName: 'Quality gate'
  - script: npm run test:api -- --project=${{ parameters.project }}
    displayName: 'API tests'
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFiles: 'test-results/**/*.xml'
      testRunTitle: 'API tests (${{ parameters.project }})'
