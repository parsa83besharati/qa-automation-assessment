trigger:
  branches:
    include: [main, develop]
  paths:
    exclude: [Docs/**, '*.md']

schedules:
  - cron: '0 6 * * *'
    branches:
      include: [main]
    always: true

pool:
  vmImage: ubuntu-latest

stages:
  - stage: QualityGate
    jobs:
      - job: lint
        steps:
          - template: steps/run-tests-template.yml
            parameters:
              project: chromium

  - stage: Smoke
    dependsOn: QualityGate
    jobs:
      - job: smoke
        steps:
          - script: npm run test:smoke
            displayName: 'Smoke UI'

  - stage: Regression
    dependsOn: Smoke
    jobs:
      - job: regression
        strategy:
          matrix:
            chromium:
              project: chromium
            firefox:
              project: firefox
            webkit:
              project: webkit
        steps:
          - script: npx playwright test tests/ui/regression.spec.ts --project=$(project)
            displayName: 'Regression $(project)'
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFiles: 'test-results/**/*.xml'
